services:
  backend:
    build: ./backend
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    env_file:
      - .env.database
      - .env.backend
    command: >
      sh -c "
      alembic upgrade head &&
      python main.py
      "
  db:
    image: postgres:16
    restart: always
    env_file:
      - .env.database
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgres
  adminer:
    image: adminer
    restart: always
    ports:
     - '8888:8080'
volumes:
  postgres_data: