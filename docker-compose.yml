services:
  backend:
    build: ./backend
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./backend:/app
    env_file:
      - .env.database
      - .env.backend
    command: >
      sh -c "
      alembic upgrade head &&
      python main.py
      "
  mysql:
    image: mysql
    restart: always
    env_file:
      - .env.database
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 10s
      retries: 10
    ports:
     - '3307:3306'
    volumes:
      - mysql_data:/var/lib/mysql
  adminer:
    image: adminer
    restart: always
    ports:
     - '8888:8080'
volumes:
  mysql_data: